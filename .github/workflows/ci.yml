name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Regenerated backend/package-lock.json is now consistent with package.json,
      # so `npm ci` gives a reproducible, pinned install.
      - run: npm ci --no-audit --no-fund

      # Use the checked-in adapter/query-compiler generation wrapper rather than
      # a raw CLI engine-resolution path.
      - run: npm run prisma:generate

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: npm test -- --ci

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BRAND_VARIANT: gold

# ---------------------------------------------------------------------------
# TO ENABLE
# The GitHub App used to authenticate this sandbox lacks the `workflows`
# permission, so it CANNOT push this file into .github/workflows/ (GitHub
# rejects the push). To turn CI on, either:
#   1. Grant the app/identity `workflows` (read & write) permission, or
#   2. On main, run yourself:
#        mkdir -p .github/workflows
#        git mv docs/ci-workflow.yml .github/workflows/ci.yml
#        git commit -m "ci: enable" && git push
# Both backend (npm ci + prisma generate + tsc + jest) and frontend
# (npm ci + typecheck + build) jobs run on ubuntu-latest / node 22.
# Verified locally: `npm ci --dry-run` passes for both lockfiles; frontend
# `npm run typecheck` is clean. Backend tsc/jest and `next build` cannot run
# in this sandbox (Prisma binary host + Google Fonts are network-blocked) but
# run on GitHub Actions which has full network access.
