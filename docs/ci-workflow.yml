name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` would fail while package-lock.json is behind package.json, so
      # install (and let the lock update) until the lockfile is regenerated.
      - run: npm install --no-audit --no-fund

      # Prisma client must exist before TypeScript can resolve @prisma/client.
      - run: npx prisma generate

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: npm test -- --ci

  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BRAND_VARIANT: gold

# ---------------------------------------------------------------------------
# To enable: move this file to .github/workflows/ci.yml and push. The Arena
# GitHub App cannot create files under .github/workflows/ itself, which is why
# it lives here for now:
#   mkdir -p .github/workflows && git mv docs/ci-workflow.yml .github/workflows/ci.yml
#   git commit -m "ci: enable" && git push
