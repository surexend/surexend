version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: surexend
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - surexend-network

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - surexend-network

volumes:
  postgres_data:

networks:
  surexend-network:
    driver: bridge
